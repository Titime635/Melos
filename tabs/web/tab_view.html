<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --z:1; --bg:#fff; --fg:#202228; --muted:#646876; --thumb:#c6c9d3; --accent:#2d7db0; --amber:#c4832a; --staff:#c3c7d1; }
  body.dark { --bg:#1a1b1e; --fg:#e6e7ec; --muted:#9c9ea9; --thumb:#4a4c56; --accent:#6aa8d2; --amber:#dba65c; --staff:#4a4d58; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px "Segoe UI",sans-serif; }
  #layout { display:flex; flex-direction:column; height:100%; }
  #score { flex:1; overflow-x:hidden; overflow-y:auto; position:relative; }
  #at { position:relative; }
  #lyr { position:absolute; left:0; top:0; width:100%; height:0; pointer-events:none; z-index:5; }
  #rhy { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
  #rhy line, #rhy circle { stroke:var(--fg); }
  #rhy circle { fill:var(--fg); }
  .sec { position:absolute; white-space:nowrap; font:600 calc(12px * var(--z)) "Segoe UI",Roboto,sans-serif; letter-spacing:.2px;
         color:var(--accent); border:1px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius:calc(6px * var(--z)); padding:0 calc(8px * var(--z));
         line-height:calc(18px * var(--z)); background:color-mix(in srgb, var(--accent) 14%, var(--bg)); }
  .pre { position:absolute; display:flex; align-items:center; gap:calc(5px * var(--z)); white-space:nowrap; pointer-events:auto; cursor:grab; height:calc(20px * var(--z)); padding:0 calc(8px * var(--z)) 0 calc(6px * var(--z));
         border-radius:calc(10px * var(--z)); font:600 calc(11px * var(--z)) "Segoe UI",Roboto,sans-serif; letter-spacing:.2px; color:var(--fg);
         background:color-mix(in srgb, var(--pc) 20%, transparent); border:1px solid color-mix(in srgb, var(--pc) 60%, transparent); }
  .pre b { display:block; width:calc(8px * var(--z)); height:calc(8px * var(--z)); border-radius:50%; background:var(--pc); }
  .pre.warn { border-style:dashed; }
  .dropl { position:absolute; pointer-events:none; width:3px; margin-left:-1px; border-radius:2px; background:var(--accent); }
  .pre.miss { --pc:var(--amber); }
  .pre.miss span { color:var(--amber); }
  .pre:hover, .bkm:hover { filter:brightness(1.15); }
  .drop { position:absolute; pointer-events:none; border:2px dashed var(--accent); border-radius:8px; box-sizing:border-box;
          background:color-mix(in srgb, var(--accent) 12%, transparent); }
  .rng { position:absolute; pointer-events:none; background:color-mix(in srgb, var(--accent) 15%, transparent);
         border-top:2px solid color-mix(in srgb, var(--accent) 55%, transparent); border-bottom:2px solid color-mix(in srgb, var(--accent) 55%, transparent); box-sizing:border-box; }
  .rng.a { border-left:3px solid var(--accent); border-top-left-radius:6px; border-bottom-left-radius:6px; }
  .rng.b { border-right:3px solid var(--accent); border-top-right-radius:6px; border-bottom-right-radius:6px; }
  .esc { position:absolute; pointer-events:none; border-radius:6px; background:color-mix(in srgb, var(--accent) 13%, transparent); }
  .esn { position:absolute; pointer-events:none; box-sizing:border-box; border:2px solid var(--accent); border-radius:6px;
         background:color-mix(in srgb, var(--accent) 22%, transparent); }
  .mod { position:absolute; pointer-events:none; width:calc(9px * var(--z)); height:calc(9px * var(--z)); border-radius:50%; background:var(--amber);
         box-shadow:0 0 0 2px color-mix(in srgb, var(--amber) 30%, transparent); }
  body.editing #at { cursor:cell; }
  #frozen { position:absolute; left:0; top:0; z-index:4; pointer-events:none; background:var(--bg); }
  .ghost { position:fixed; z-index:50; pointer-events:none; opacity:.92; box-shadow:0 4px 14px rgba(0,0,0,.35); }
  .bkm { position:absolute; display:flex; align-items:center; gap:calc(5px * var(--z)); white-space:nowrap; pointer-events:auto; cursor:grab;
         font:600 calc(12px * var(--z)) "Segoe UI",Roboto,sans-serif; color:var(--amber); }
  .bkm i { display:block; width:calc(10px * var(--z)); height:calc(16px * var(--z)); background:var(--amber); clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%); }
  .lyr { position:absolute; white-space:nowrap; font:italic 600 calc(13px * var(--z)) "Segoe UI",Roboto,sans-serif; color:var(--fg);
         transform:translateX(-2px); }
  #msg { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; height:62vh;
         padding:24px; text-align:center; color:var(--muted); }
  #msg .ico { font-size:46px; line-height:1; opacity:.55; }
  #msg .t { font:600 18px "Segoe UI",sans-serif; color:var(--fg); opacity:.85; }
  #msg .s { max-width:360px; line-height:1.45; }
  #score::-webkit-scrollbar { width:14px; }
  #score::-webkit-scrollbar-track { background:transparent; }
  #score::-webkit-scrollbar-thumb { background:var(--thumb); border-radius:7px; border:4px solid transparent; background-clip:padding-box; min-height:48px; }
  #score::-webkit-scrollbar-thumb:hover { background:var(--muted); background-clip:padding-box; }
  .at-cursor-bar { background:color-mix(in srgb, var(--accent) 12%, transparent); }
  .at-cursor-beat { background:var(--accent); width:2px; border-radius:1px; }
  .at-selection div { background:color-mix(in srgb, var(--accent) 16%, transparent); }
  .at-highlight * { fill:var(--accent); stroke:var(--accent); }
</style></head>
<body>
<div id="layout">
  <div id="score"><div id="at"><div id="msg"><div class="ico">♪</div><div class="t">Aucune partition</div><div class="s">Cherche un morceau par son nom ou colle un lien Songsterr, puis valide avec Entrée. Tes morceaux récents et favoris sont dans « Morceaux ».</div></div></div><div id="lyr"></div></div>
</div>
<script src="/alphatab/alphaTab.min.js"></script>
<script>
const melos = (() => {
  let api = null, busy = false, pending = false, busyTimer = 0, rate = 1, duration = 0, fromVideo = false, starts = [], lyr = [], marks = [], bookmarks = [], presets = [], rangeBars = null, editOn = false, esel = null, edited = [], keepScroll = null, curVoice = 0, loopOn = false, Z = 1;
  function setZ(z) {
    Z = z > 0 ? z : 1; document.documentElement.style.setProperty('--z', Z);
    STEM_GAP = 9 * Z; STEM_LEN = 20 * Z; BEAM_STEP = 5 * Z; BEAM_W = 3 * Z;
  }
  // Deux modes : « original » (l'audio YouTube joué par mpv pilote le curseur) et « synth » (synthétiseur MIDI d'alphaTab :
  // toute la partition est chargée, une seule piste est affichée, mute / solo / volume par piste sont libres).
  let mode = 'original', shownIdx = 0, posDirty = false, posLast = null, lastBar = -1, playing = false, mix = {solo: new Set(), mute: new Set(), vol: {}};
  const shown = () => api.score.tracks[shownIdx];
  // File d'évènements lue par Python (QtWebEngine : interrogée via runJavaScript)
  const events = [];
  const emit = (type, data) => events.push({type, data});

  // alphaTab pilote un « média externe » : ici ses ordres (lecture, pause, saut) sont renvoyés à Python,
  // qui les applique à la vidéo YouTube (une autre vue) ; la position de la vidéo revient par setTime().
  const handler = {
    get backingTrackDuration() { return duration; },
    get playbackRate() { return rate; },
    set playbackRate(v) { rate = v; if (!fromVideo) emit('rate', v); },
    masterVolume: 1,
    seekTo(ms) { /* les sauts viennent de beatMouseDown (plus fiable que ce rappel) */ },
    play() { if (!fromVideo) emit('play', 1); },
    pause() { if (!fromVideo) emit('pause', 1); },
  };

  // Clic sur la partition -> temps correspondant dans l'audio, calculé ICI avec les points de synchro (début de chaque
  // mesure) : position dans la mesure en proportion de sa durée.
  function timeOfBeat(beat) {
    const mb = beat.voice.bar.masterBar, i = mb.index;
    if (!starts.length || i >= starts.length) return null;
    const a = starts[i];
    const b = i + 1 < starts.length ? starts[i + 1] : a + (i > 0 ? a - starts[i - 1] : 2000);
    const frac = (beat.playbackStart - mb.start) / mb.calculateDuration();
    return a + (b - a) * Math.max(0, Math.min(1, frac));
  }

  function load(tex, dark, startsMs, lyricsList, markersList, opts) {
    opts = opts || {};
    mode = opts.mode === 'synth' ? 'synth' : 'original';
    shownIdx = opts.track || 0; setZ(opts.scale);
    lastBar = -1; playing = false; posDirty = false;
    mix = {solo: new Set(opts.solo || []), mute: new Set(opts.mute || []), vol: Object.assign({}, opts.vol || {})};
    starts = (startsMs || []).slice(); clk.beats = null; clk.lastT = -1;
    document.body.classList.toggle('dark', !!dark);
    const scroller = document.getElementById('score');
    unfreeze();
    if (api) { try { api.destroy(); } catch (err) { /* déjà détruit */ } }
    // Nouveau conteneur à chaque chargement : le dessin encore en cours de l'ancienne partition (changement d'instrument
    // en pleine mise en page) se termine dans l'ancien conteneur, détaché, et ne se superpose plus à la nouvelle.
    const el = document.createElement('div');
    el.id = 'at';
    el.style.visibility = 'hidden';        // jusqu'à la mise en page finale : le premier dessin (provisoire) ne doit pas se voir
    document.getElementById('at').replaceWith(el);
    lyr = (lyricsList || []).slice();
    marks = (markersList || []).slice();
    bookmarks = (opts.bookmarks || []).slice();
    presets = (opts.presets || []).slice();
    rangeBars = opts.range ? opts.range.slice() : null;
    edited = (opts.edited || []).slice(); editOn = !!opts.edit; curVoice = opts.voice | 0; loopOn = !!opts.loopMode; esel = null; document.body.classList.toggle('editing', editOn);
    phase = 0; nat = tgt = null; busy = true; pending = false;
    clearTimeout(busyTimer); busyTimer = setTimeout(() => { busy = false; el.style.visibility = 'visible'; }, 15000);   // garde-fou
    document.getElementById('lyr').innerHTML = '';
    const me = api = new alphaTab.AlphaTabApi(el, {
      // pas de chargement « paresseux » : alphaTab ne dessine que les morceaux visibles et, dans QtWebEngine (GPU),
      // le bas de la partition restait parfois vide ; tout est dessiné d'un coup (quelques centaines de mesures au plus)
      core: { fontDirectory: '/alphatab/font/', useWorkers: false, tex: false, enableLazyLoading: false },
      display: {
        layoutMode: alphaTab.LayoutMode.Page, scale: opts.scale || 1.0,
        // lignes plus espacées (les notes entre deux cordes, les effets, les paroles et les rythmes respirent)
        stretchForce: 0, systemPaddingTop: 28, systemPaddingBottom: 78, notationStaffPaddingTop: 22, notationStaffPaddingBottom: 22,
        effectBandPaddingBottom: 8,
        resources: Object.assign({ tablatureFont: 'bold 14px Roboto, Arial, sans-serif', graceFont: 'bold 10px Roboto, Arial, sans-serif' },
          // thème sombre : couleurs d'alphaTab (pas de filtre CSS : trop lourd pour le GPU, cause probable de plantages)
          // lignes de portée discrètes, numéros de mesure dans un bleu-gris doux (plus de rouge sur gris)
          dark ? { mainGlyphColor: '#e6e7ec', secondaryGlyphColor: '#9fa2ae', staffLineColor: '#4a4d58',
                   barSeparatorColor: '#6b6e7b', barNumberColor: '#7f95b3', scoreInfoColor: '#e6e7ec' }
               : { mainGlyphColor: '#202228', secondaryGlyphColor: '#5d616e', staffLineColor: '#c3c7d1',
                   barSeparatorColor: '#8a90a0', barNumberColor: '#7088aa', scoreInfoColor: '#202228' }),
      },
      notation: { notationMode: alphaTab.NotationMode.GuitarPro, elements: { [alphaTab.NotationElement.GuitarTuning]: false },
                  rhythmMode: alphaTab.TabRhythmMode.Hidden, extendBendArrowsOnTiedNotes: false },
      player: Object.assign({ scrollMode: alphaTab.ScrollMode.Off, scrollElement: scroller, enableCursor: true, enableAnimatedBeatCursor: true,
                              enableUserInteraction: false },   // clics et sélections sont gérés par la page (seek, zone de boucle, édition)
        mode === 'synth'
          ? { playerMode: alphaTab.PlayerMode.EnabledSynthesizer, soundFont: opts.soundFont || '/alphatab/soundfont/sonivox.sf2' }
          : { playerMode: alphaTab.PlayerMode.EnabledExternalMedia }),
    });
    api.error.on(e => { if (api === me) { el.style.visibility = 'visible'; emit('log', 'erreur alphaTab : ' + String(e && e.stack || e)); emit('error', String(e && e.message || e)); } });
    api.scoreLoaded.on(s => { if (api === me) emit('score', {tracks: s.tracks.map(t => t.name), bars: s.masterBars.length}); });
    // Fin de dessin : on ne relance JAMAIS un dessin depuis l'évènement lui-même (alphaTab l'émet plusieurs fois et avant
    // d'avoir fini de poser ses morceaux : un second dessin lancé là se mélangeait au premier = deux partitions
    // superposées). On attend que tout soit posé (40 ms sans nouvel évènement), puis on enchaîne.
    let settleTimer = 0;
    const settle = () => {
      if (api !== me) return;
      busy = false; clearTimeout(busyTimer);
      if (pending) { pending = false; if (phase === 1 && api.score) { applyLayout(); return; } }   // fenêtre redimensionnée pendant le dessin
      if (fitLayout()) return;
      drawOverlays(); el.style.visibility = 'visible'; emit('rendered', 1);
      if (keepScroll !== null) { scroller.scrollTop = keepScroll; keepScroll = null; }
      unfreeze();
    };
    api.renderStarted.on(() => { if (api === me) clearTimeout(settleTimer); });
    api.postRenderFinished.on(() => { if (api !== me) return; clearTimeout(settleTimer); settleTimer = setTimeout(settle, 40); });
    api.playerReady.on(() => {
      if (api !== me) return;
      if (mode === 'synth') { synthReady(opts); return; }
      api.player.output.handler = handler; emit('player-ready', 1);
    });
    api.playedBeatChanged.on(beat => {
      if (api !== me) return;
      followBeat(beat);
      if (mode === 'synth') { const i = beat.voice.bar.index; if (i !== lastBar) { lastBar = i; emit('bar', i); } }
    });
    if (mode === 'synth') {
      api.playerPositionChanged.on(e => { if (api === me) { posDirty = true; posLast = e; } });      // un évènement par bloc audio : on ne garde que le dernier
      api.playerStateChanged.on(e => { if (api === me) { playing = e.state === 1; emit('state', playing); } });
      api.playerFinished.on(() => { if (api === me) emit('finished', 1); });
      api.playbackRangeChanged.on(e => { if (api === me) { if (e.playbackRange) { const lo = barOfTick(e.playbackRange.startTick), hi = barOfTick(e.playbackRange.endTick - 1); rangeBars = [lo, hi]; emit('range', rangeInfo(lo, hi)); } else { rangeBars = null; emit('range', null); } } });
    }
    scroller.addEventListener('wheel', () => { userScrollUntil = performance.now() + 4000; }, {passive: true});
    scroller.addEventListener('touchmove', () => { userScrollUntil = performance.now() + 4000; }, {passive: true});
    lastRow = -1;
    api.tex(tex, [shownIdx]);
  }

  // Rechargement pour une modification : l'ancien dessin reste affiché (copie figée) pendant que alphaTab redessine et remet en page
  // en deux temps ; on ne voit plus la partition se vider, se recaler ni sauter. Retirée dès que la nouvelle est prête.
  function freeze() {
    unfreeze();
    const at = document.getElementById('at');
    if (!at || !at.querySelector('svg')) return;
    const h = at.offsetHeight, f = at.cloneNode(true);
    f.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));       // pas d'identifiants en double
    f.id = 'frozen'; f.style.width = at.offsetWidth + 'px'; f.style.height = h + 'px';
    at.style.minHeight = h + 'px';
    at.parentNode.insertBefore(f, at);
  }
  function unfreeze() {
    const f = document.getElementById('frozen'); if (f) f.remove();
    const at = document.getElementById('at'); if (at) at.style.minHeight = '';
  }

  // Mesure sous un point de la fenêtre (coordonnées client). `loose` : tolère un point un peu hors des lignes (glisser-déposer,
  // clic droit) en prenant la ligne la plus proche (à moins de 70 px).
  function barAtClient(cx, cy, loose) {
    if (!api || !api.boundsLookup) return null;
    const r = document.getElementById('at').getBoundingClientRect(), x = cx - r.left, y = cy - r.top;
    if (!loose && (y < 0 || y > r.height || x < 0 || x > r.width)) return null;
    let sysHit = null, best = 1e9;
    for (const sys of api.boundsLookup.staffSystems) {
      const v = sys.visualBounds, d = y < v.y ? v.y - y : y > v.y + v.h ? y - v.y - v.h : 0;
      if (d < best) { best = d; sysHit = sys; }
    }
    if (!sysHit || best > (loose ? 70 : 0)) return null;
    let hit = null;
    for (const mb of sysHit.bars) { const b = mb.visualBounds; if (x >= b.x && x <= b.x + b.w) { hit = mb; break; } }
    if (!hit) { let bd = 1e9; for (const mb of sysHit.bars) { const d = Math.abs(x - (mb.visualBounds.x + mb.visualBounds.w / 2)); if (d < bd) { bd = d; hit = mb; } } }
    return hit ? {mb: hit, x, y} : null;
  }
  // Clic simple sur la partition (mode Original) -> saut dans l'audio : temps calculé avec les points de synchro.
  function seekAt(cx, cy) {
    if (!api || !api.boundsLookup) { emit('log', 'clic partition : alphaTab pas prêt'); return; }
    const h = barAtClient(cx, cy, false);
    if (!h) { emit('log', `clic partition (${cx|0},${cy|0}) : aucune mesure`); return; }
    const hit = h.mb, x = h.x;
    const beat = hit.findBeatAtPos(x);
    if (mode === 'synth') {                                    // synthèse : on place la tête de lecture sur le temps visé
      api.tickPosition = beat ? beat.absolutePlaybackStart : api.score.masterBars[hit.index].start;
      return;
    }
    let t = null;
    if (beat) t = timeOfBeat(beat);
    else if (hit.index < starts.length) {
      const a = starts[hit.index], b = hit.index + 1 < starts.length ? starts[hit.index + 1] : a + 2000;
      t = a + (b - a) * Math.max(0, Math.min(1, (x - hit.realBounds.x) / Math.max(1, hit.realBounds.w)));
    }
    emit('log', `clic partition mesure ${hit.index + 1} -> ${t === null ? 'pas de synchro' : (t / 1000).toFixed(2) + ' s'}`);
    if (t !== null) emit('seek', t);
  }

  // ---- édition : un clic choisit un temps (mesure, temps) et une corde ; Python tient le modèle et renvoie la sélection
  function stringAt(bb, cy) {
    const el = document.getElementById('at').getBoundingClientRect(), r = bb.barBounds.realBounds, n = shown().staves[0].tuning.length;
    const y = cy - el.top, step = r.h / Math.max(1, n - 1);
    return Math.max(0, Math.min(n - 1, Math.round((y - r.y) / step)));
  }
  // temps de la voix `v` de la mesure `mb` le plus proche de l'abscisse `x` (null si cette voix n'est pas dessinée : voix de silences)
  function beatInVoice(mb, v, x) {
    const bar = shown().staves[0].bars[mb.index], vo = bar && bar.voices[v];
    let best = null, bd = 1e9;
    if (vo) for (const b of vo.beats) {
      const bb = api.boundsLookup.findBeat(b);
      if (!bb) continue;
      const a = bb.realBounds.x, z = a + bb.realBounds.w, d = x < a ? a - x : x > z ? x - z : 0;
      if (d < bd) { bd = d; best = b; }
    }
    return best;
  }
  function editClick(cx, cy) {
    const h = barAtClient(cx, cy, false);
    if (!h) return;
    const beat = curVoice ? beatInVoice(h.mb, curVoice, h.x) : h.mb.findBeatAtPos(h.x), bb = beat && api.boundsLookup.findBeat(beat);
    if (!beat || !bb) {
      const vb = h.mb.visualBounds;
      emit('editsel', {bar: h.mb.index, beat: -1, string: 0, voice: curVoice, frac: Math.max(0, Math.min(1, (h.x - vb.x) / Math.max(1, vb.w)))});
      return;
    }
    esel = {bar: h.mb.index, beat: beat.index, string: stringAt(bb, cy), voice: curVoice};
    drawOverlays();
    emit('editsel', esel);
  }
  // ---- cible de dépôt (glisser-déposer) : la mesure visée est entourée en pointillés ; la liste défile près des bords
  // temps d'une mesure : « temps » de la signature (4/4 = 4 noires, 6/8 = 6 croches...) ; les changements de preset s'y calent
  function slotInfo(i) { const mb = api.score.masterBars[i]; return {num: mb.timeSignatureNumerator || 4, unit: 3840 / (mb.timeSignatureDenominator || 4)}; }
  function beatX(i, k) {                     // abscisse (repère de la partition) du temps k de la mesure i ; null si la mesure n'est pas dessinée
    const bar = shown().staves[0].bars[i], v0 = bar && bar.voices[0];
    const fb = v0 && v0.beats[0] && api.boundsLookup.findBeat(v0.beats[0]);
    if (!fb) return null;
    const mv = fb.barBounds.masterBarBounds.visualBounds;
    if (!k) return mv.x;
    const unit = slotInfo(i).unit, want = k * unit;
    for (const b of v0.beats) {
      if (b.playbackStart >= want - 1) {
        if (b.playbackStart <= want + unit / 4) { const bb = api.boundsLookup.findBeat(b); if (bb) return bb.visualBounds.x; }
        break;
      }
    }
    return mv.x + mv.w * Math.min(1, want / Math.max(1, api.score.masterBars[i].calculateDuration()));   // pas de note pile là : on répartit
  }
  function beatAtX(h) {                      // temps de la mesure le plus proche (horizontalement) du point visé
    const i = h.mb.index, n = slotInfo(i).num;
    let best = 0, bd = 1e9;
    for (let k = 0; k < n; k++) { const x = beatX(i, k); if (x !== null && Math.abs(h.x - x) < bd) { bd = Math.abs(h.x - x); best = k; } }
    return best;
  }
  let dropEl = null;
  function clearDrop() { if (dropEl) { dropEl.remove(); dropEl = null; } }
  function showDrop(h, beat) {               // beat >= 0 : on vise un temps précis (trait vertical) et non la mesure entière
    clearDrop();
    if (!h) return;
    const b = h.mb.visualBounds, d = document.createElement('div');
    if (beat >= 0) {
      const x = beatX(h.mb.index, beat);
      d.className = 'dropl'; d.style.cssText = `left:${x === null ? b.x : x}px;top:${b.y - 10}px;height:${b.h + 20}px`;
    } else {
      d.className = 'drop';
      d.style.cssText = `left:${b.x}px;top:${b.y - 6}px;width:${b.w}px;height:${b.h + 12}px`;
    }
    document.getElementById('lyr').appendChild(d);
    dropEl = d;
  }
  function autoScroll(cy) {
    const el = document.getElementById('score'), r = el.getBoundingClientRect();
    if (cy < r.top + 44) el.scrollTop -= Math.max(4, (r.top + 44 - cy) / 2.5);
    else if (cy > r.bottom - 44) el.scrollTop += Math.max(4, (cy - r.bottom + 44) / 2.5);
  }
  // ---- déplacer un marqueur (pastille de preset / drapeau de marque-page) d'une mesure à une autre
  let mk = null;
  function endMarkDrag(commit) {
    if (!mk) return;
    if (mk.ghost) mk.ghost.remove();
    mk.pill.style.opacity = '';

      api.metronomeVolume = o.metronome ? 1 : 0;
      api.countInVolume = o.countIn ? 1 : 0;
      api.isLooping = !!o.loop;
      applyMix();
      if (rangeBars) synth.setRange(rangeBars[0], rangeBars[1]);
      if (o.bar !== undefined && o.bar >= 0) api.tickPosition = tickOf(o.bar, o.frac);
    } catch (err) { emit('error', 'synthèse : ' + err); }
    emit('player-ready', 1);
  }
  // Même partition, autre piste affichée : pas de rechargement (le synthétiseur continue de jouer), seulement un nouveau
  // dessin en deux passes (largeurs naturelles, puis mise en page), comme au chargement.
  function setTrack(idx, lyricsList, markersList) {
    if (!api || !api.score || !api.score.tracks[idx]) return;
    shownIdx = idx;
    lyr = (lyricsList || []).slice(); marks = (markersList || []).slice();
    resetLayout();
  }
  // Repart de zéro : largeurs naturelles à l'échelle courante, puis nouvelle répartition des mesures par ligne
  // (même procédure pour un changement de piste et pour un changement de zoom : le nombre de mesures par ligne suit).
  function resetLayout() {
    const track = shown();
    for (const b of track.staves[0].bars) b.displayScale = 1;
    track.systemsLayout = [];
    phase = 0; nat = tgt = null; busy = true; pending = false; lastRow = -1;
    document.getElementById('lyr').innerHTML = '';
    const el = document.getElementById('at'); el.style.visibility = 'hidden';
    clearTimeout(busyTimer); busyTimer = setTimeout(() => { busy = false; el.style.visibility = 'visible'; }, 15000);
    api.settings.display.systemsLayoutMode = alphaTab.SystemsLayoutMode.Automatic;
    api.settings.display.stretchForce = 0;
    api.updateSettings();
    api.renderTracks([track]);
  }
  function exportMidi() {
    const file = new alphaTab.midi.MidiFile();
    const gen = new alphaTab.midi.MidiFileGenerator(api.score, api.settings, new alphaTab.midi.AlphaSynthMidiFileHandler(file, true));
    gen.generate();
    const bytes = file.toBinary();
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  const synth = {
    toggle() { if (api) api.playPause(); },
    pause() { if (api && api.playerState === 1) api.pause(); },
    seekMs(ms) { if (api) api.timePosition = Math.max(0, ms); },
    seekBar(i, frac) { if (api && api.score) api.tickPosition = tickOf(i, frac); },
    speed(r) { if (api) api.playbackSpeed = r; },
    volume(v) { if (api) api.masterVolume = v; },
    metronome(on) { if (api) api.metronomeVolume = on ? 1 : 0; },
    countIn(on) { if (api) api.countInVolume = on ? 1 : 0; },
    loop(on) { if (api) api.isLooping = !!on; },
    clearRange() { rangeBars = null; if (api) { if (mode === 'synth') { api.playbackRange = null; api.clearPlaybackRangeHighlight(); } drawOverlays(); } emit('range', null); },
    // zone de boucle choisie depuis Python (menu clic droit) : mesures a..b incluses
    setRange(a, b) {
      if (!api || !api.score) return;
      const lo = Math.max(0, Math.min(a, b)), hi = Math.min(api.score.masterBars.length - 1, Math.max(a, b));
      rangeBars = [lo, hi];
      if (mode === 'synth') {
        const mbs = api.score.masterBars;
        api.playbackRange = {startTick: mbs[lo].start, endTick: mbs[hi].start + mbs[hi].calculateDuration()};
        api.clearPlaybackRangeHighlight();                                 // le style de la zone est celui de la page (surcouche), pas celui d'alphaTab
      }
      drawOverlays();
      emit('range', rangeInfo(lo, hi));
    },
    mix(solo, mute, vol) {
      mix = {solo: new Set(solo), mute: new Set(mute), vol: Object.assign({}, vol)};
      if (api && api.score && api.player && api.player.isReady !== false) { try { applyMix(); } catch (err) { emit('error', 'mixage : ' + err); } }
    },
    exportMidi,
  };
  // ---------- métronome et décompte du mode Original ----------
  // En mode Original l'audio vient de mpv (autre processus) : les clics sont produits ici (WebAudio) et calés sur la position
  // qu'envoie Python toutes les ~50 ms. L'horloge de la page prolonge cette position entre deux messages ; les clics des
  // 180 ms à venir sont planifiés à l'avance sur l'horloge audio (précis), seule la dérive de mpv peut les décaler un peu.
  const clk = {on: false, vol: 0.6, ctx: null, refMs: 0, refPerf: 0, playing: false, rate: 1, lastT: -1, beats: null, nodes: []};
  function audioCtx() {
    if (!clk.ctx) clk.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (clk.ctx.state === 'suspended') clk.ctx.resume();
    return clk.ctx;
  }
  function clickAt(when, accent) {
    const ctx = audioCtx(), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = accent ? 1568 : 1046;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, clk.vol * (accent ? 1 : 0.7)), when + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.06);
    o.connect(g); g.connect(ctx.destination);
    o.start(when); o.stop(when + 0.07);
    clk.nodes.push(o); o.onended = () => { const i = clk.nodes.indexOf(o); if (i >= 0) clk.nodes.splice(i, 1); };
  }
  const stopClicks = () => { for (const o of clk.nodes.splice(0)) { try { o.stop(); } catch (err) { /* déjà arrêté */ } } };
  function beatTable() {                                  // temps de chaque mesure : réparti entre deux points de synchro
    if (clk.beats) return clk.beats;
    const out = [];
    if (api && api.score && starts.length) {
      const mbs = api.score.masterBars;
      for (let i = 0; i < Math.min(starts.length, mbs.length); i++) {
        const num = mbs[i].timeSignatureNumerator || 4, a = starts[i], b = i + 1 < starts.length ? starts[i + 1] : a + (i ? a - starts[i - 1] : 2000);
        for (let k = 0; k < num; k++) out.push({t: a + (b - a) * k / num, acc: k === 0});
      }
    }
    return clk.beats = out;
  }
  setInterval(() => {
    if (!clk.on || !clk.playing || mode === 'synth' || document.hidden) return;
    const beats = beatTable();
    if (!beats.length) return;
    const t = clk.refMs + (performance.now() - clk.refPerf) * clk.rate, horizon = t + 180 * clk.rate, from = Math.max(clk.lastT, t - 30);
    let lo = 0, hi = beats.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (beats[mid].t > from) hi = mid; else lo = mid + 1; }
    const now = audioCtx().currentTime;
    for (let i = lo; i < beats.length && beats[i].t <= horizon; i++) { clickAt(now + Math.max(0, (beats[i].t - t) / clk.rate / 1000), beats[i].acc); clk.lastT = beats[i].t; }
  }, 25);
  function clockUpdate(ms, playingNow, r) {
    const now = performance.now(), pred = clk.refMs + (now - clk.refPerf) * clk.rate;
    if (!clk.playing || !playingNow || Math.abs(pred - ms) > 120) { clk.refMs = ms; clk.lastT = ms - 1; stopClicks(); }
    else clk.refMs = pred + (ms - pred) * 0.15;           // correction douce : pas de saccades
    clk.refPerf = now; clk.playing = playingNow; clk.rate = r || 1;
  }

  // --- Sonde de diagnostic (coupures de la synthèse) : écrit dans melos_debug.log (source « page »). On y voit si le thread de la
  // page se bloque, si l'horloge audio saute ou dérive, et si la mémoire JS grossit au fil des heures. Aucun effet sur le son.
  (function probe() {
    let last = performance.now(), ctxT = null, wall = 0, lastMem = 0;
    const T0 = performance.now();
    setInterval(() => {
      const now = performance.now(), gap = now - last; last = now;
      if (document.hidden) { ctxT = null; return; }          // page cachée : Chromium ralentit les minuteries, ce ne serait que de faux positifs
      if (gap > 250) emit('log', `SONDE page bloquée ${gap | 0} ms (attendu 50) à ${((now - T0) / 1000).toFixed(1)} s`);
      try {
        const out = api && api.player && api.player.output;
        const ctx = out && (out._context || out.context || out._audioContext);
        if (ctx && typeof ctx.currentTime === 'number') {
          if (ctxT !== null && ctx.state === 'running') {
            const dAudio = (ctx.currentTime - ctxT) * 1000, dWall = now - wall;
            if (Math.abs(dAudio - dWall) > 120) emit('log', `SONDE horloge audio : +${dAudio | 0} ms audio pour +${dWall | 0} ms réels (état ${ctx.state})`);
          }
          if (ctx.state !== 'running' && playing) emit('log', `SONDE contexte audio en état « ${ctx.state} » pendant la lecture`);
          ctxT = ctx.currentTime; wall = now;
        }
      } catch (err) { /* sonde : jamais d'erreur visible */ }
      if (performance.memory && now - lastMem > 60000) {
        lastMem = now;
        emit('log', `SONDE mémoire JS ${(performance.memory.usedJSHeapSize / 1048576).toFixed(0)} Mo (tas ${(performance.memory.totalJSHeapSize / 1048576).toFixed(0)} Mo) à ${((now - T0) / 60000).toFixed(0)} min`);
      }
    }, 50);
  })();
  return {
    load, handler, setTrack, synth,
    setDuration(ms) { duration = ms; },
    // métronome / décompte (mode Original) : réglage, et suite de clics isolés (décompte avant le départ)
    click(on, vol) { clk.on = !!on; if (vol !== undefined) clk.vol = vol; if (!on) stopClicks(); else audioCtx(); },
    stopClicks,
    // décompte : une mesure de clics (au tempo de la mesure `bar`, vitesse r) ; renvoie les ms avant le temps fort de départ
    countInBar(bar, r) {
      if (!api || !api.score || !starts.length) return 0;
      const i = Math.max(0, Math.min(bar, starts.length - 1)), mbs = api.score.masterBars, num = (mbs[i] && mbs[i].timeSignatureNumerator) || 4;
      const a = starts[i], b = i + 1 < starts.length ? starts[i + 1] : a + (i ? a - starts[i - 1] : 2000);
      const interval = (b - a) / num / (r || 1), t0 = audioCtx().currentTime + 0.06;
      for (let k = 0; k < num; k++) clickAt(t0 + k * interval / 1000, k === 0);
      return Math.round(60 + num * interval);
    },
    countClicks(n, intervalMs) { const t0 = audioCtx().currentTime + 0.05; for (let i = 0; i < n; i++) clickAt(t0 + i * intervalMs / 1000, i === 0); },
    // Marque-pages [[mesure, nom]] : redessinés tout de suite si la partition est affichée (sinon au prochain dessin)
    setPresets(list) { presets = (list || []).slice(); if (api && api.score && phase === 1 && !busy) drawOverlays(); },
    setBookmarks(list) { bookmarks = (list || []).slice(); if (api && api.score && phase === 1 && !busy) drawOverlays(); },
    // Fait défiler la partition jusqu'à la mesure (même si on avait défilé à la main)
    revealBar(i) {
      if (!api || !api.boundsLookup || !api.score) return;
      const bar = shown().staves[0].bars[i], beat = bar && bar.voices[0] && bar.voices[0].beats[0];
      if (beat) { refocus = true; userScrollUntil = 0; followBeat(beat); }
    },
    // Nouveaux points de synchro (ms de début de chaque mesure dans l'audio) sans recharger ni redessiner la partition
    setSync(list) {
      starts = list.slice(); clk.beats = null;
      if (!api || !api.score) return;
      api.score.applyFlatSyncPoints(list.map((ms, i) => ({barIndex: i, barOccurence: 0, barPosition: 0,
                                                          millisecondOffset: Math.max(0, Math.round(ms))})));
      api.loadMidiForScore();
    },
    // état de la vidéo, envoyé par Python toutes les ~50 ms
    sync(ms, playing, r) {   // vitesse r : cf handler.playbackRate
      if (!api || !api.player || !api.player.output) return;
      if (playing && !wasPlaying) { refocus = true; userScrollUntil = 0; }
      wasPlaying = playing;
      clockUpdate(ms, playing, r);
      fromVideo = true;
      try {
        if (r && r !== rate) rate = r;
        if (playing && api.playerState !== 1) api.play();
        if (!playing && api.playerState === 1) api.pause();
        if (api.player.output.updatePosition) api.player.output.updatePosition(ms);
      } finally { fromVideo = false; }
    },
    play() { api && api.playPause(); },
    seekBar(i) { const mb = api && api.score && api.score.masterBars[i]; if (mb) { api.tickPosition = mb.start; } },
    setTracks(idx) { if (api && api.score) api.renderTracks(idx.map(i => api.score.tracks[i])); },
    setScale(s) {
      if (!api || !api.score) return;
      api.settings.display.scale = s; setZ(s);
      resetLayout();
    },
    // édition : mode, sélection, mesures modifiées, nouveau contenu (même alphaTab : la banque de sons reste chargée)
    setEdit(on) { editOn = !!on; document.body.classList.toggle('editing', editOn); if (!editOn) esel = null; if (api && api.score && phase === 1 && !busy) drawOverlays(); },
    setVoice(v) { curVoice = v | 0; },
    setLoopMode(on) { loopOn = !!on; },
    select(bar, beat, string, voice) { esel = bar >= 0 && beat >= 0 ? {bar, beat, string, voice: voice | 0} : null; if (api && api.score && phase === 1 && !busy) drawOverlays(); },
    setEdited(list) { edited = (list || []).slice(); if (api && api.score && phase === 1 && !busy) drawOverlays(); },
    reload(tex, lyricsList, markersList, o) {
      if (!api) return;
      o = o || {};
      shownIdx = o.track || 0; edited = (o.edited || []).slice();
      lyr = (lyricsList || []).slice(); marks = (markersList || []).slice();
      keepScroll = document.getElementById('score').scrollTop;
      freeze();
      phase = 0; nat = tgt = null; busy = true; pending = false; lastRow = -1;
      document.getElementById('lyr').innerHTML = '';
      clearTimeout(busyTimer); busyTimer = setTimeout(() => { busy = false; keepScroll = null; unfreeze(); }, 15000);
      api.settings.display.systemsLayoutMode = alphaTab.SystemsLayoutMode.Automatic;      // comme au premier chargement : largeurs naturelles d'abord
      api.settings.display.stretchForce = 0;
      api.updateSettings();
      api.tex(tex, [shownIdx]);
    },
    // zone de boucle (mode Original aussi) : mêmes noms qu'en synthèse
    setRange(a, b) { synth.setRange(a, b); },
    clearRange() { synth.clearRange(); },
    // glisser-déposer depuis une fenêtre Python : survol (renvoie la mesure visée, -1 si aucune), dépôt, annulation
    dragHover(cx, cy, fine) { const h = barAtClient(cx, cy, true); showDrop(h, h && fine ? beatAtX(h) : -1); autoScroll(cy); return h ? h.mb.index : -1; },
    dragEnd(cx, cy) { const h = barAtClient(cx, cy, true); clearDrop(); return h ? {bar: h.mb.index, beat: beatAtX(h)} : -1; },
    dragCancel() { clearDrop(); },
    drain() {
      if (posDirty && api && api.score && mode === 'synth') {          // position du synthétiseur : toujours la plus récente
        posDirty = false;
        const bar = barOfTick(posLast.currentTick), mb = api.score.masterBars[bar];
        events.push({type: 'pos', data: {ms: posLast.currentTime, dur: posLast.endTime, bar, frac: (posLast.currentTick - mb.start) / mb.calculateDuration()}});
      }
      const e = events.splice(0); return JSON.stringify(e);
    },
    _api: () => api,
    _edited: () => edited,
  };
})();
</script>
</body></html>
